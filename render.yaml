databases:
  - name: socialposter-db
    plan: free
    databaseName: socialposter
    user: socialposter

services:
  - type: web
    name: socialposter
    runtime: python
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      mkdir -p src/socialposter/web/static/spa
      cp -r frontend/dist/* src/socialposter/web/static/spa/
      pip install .
    startCommand: |
      SITE=$(python -c "import socialposter.web.app as m; from pathlib import Path; print(Path(m.__file__).resolve().parent)")
      echo "Package web dir: $SITE"
      echo "SPA exists before copy: $([ -f $SITE/static/spa/index.html ] && echo YES || echo NO)"
      echo "frontend/dist exists: $([ -f frontend/dist/index.html ] && echo YES || echo NO)"
      if [ ! -f "$SITE/static/spa/index.html" ] && [ -f "frontend/dist/index.html" ]; then
        mkdir -p "$SITE/static/spa"
        cp -r frontend/dist/* "$SITE/static/spa/"
        echo "Copied SPA to $SITE/static/spa/"
      fi
      echo "SPA exists after copy: $([ -f $SITE/static/spa/index.html ] && echo YES || echo NO)"
      exec gunicorn "socialposter.web.app:create_app()" --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SOCIALPOSTER_SECRET_KEY
        generateValue: true
      - key: SOCIALPOSTER_ENCRYPTION_KEY
        generateValue: true
      - key: FLASK_APP
        value: socialposter.web.app:create_app
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: socialposter-db
          property: connectionString
      # Tell the app to write uploads onto the persistent disk below.
      - key: SOCIALPOSTER_UPLOAD_DIR
        value: /var/data/uploads
    # Persistent disk so user uploads survive restarts and redeploys.
    # Render charges $0.25/GB-month; 1 GB is the minimum.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
