databases:
  - name: socialposter-db
    plan: free
    databaseName: socialposter
    user: socialposter

services:
  - type: web
    name: socialposter
    runtime: python
    buildCommand: |
      cd frontend && npm ci && npm run build
      mkdir -p src/socialposter/web/static/spa
      cp -r frontend/dist/* src/socialposter/web/static/spa/
      pip install .
    # Single worker: APScheduler runs in-process, so multiple workers would
    # fire each scheduled post once per worker. Stick with 1 until the
    # scheduler moves to a separate dyno or uses a DB-backed lock.
    startCommand: gunicorn "socialposter.web.app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SOCIALPOSTER_SECRET_KEY
        generateValue: true
      - key: SOCIALPOSTER_ENCRYPTION_KEY
        generateValue: true
      - key: FLASK_APP
        value: socialposter.web.app:create_app
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: socialposter-db
          property: connectionString
      # Tell the app to write uploads onto the persistent disk below.
      - key: SOCIALPOSTER_UPLOAD_DIR
        value: /var/data/uploads
    # Persistent disk so user uploads survive restarts and redeploys.
    # Render charges $0.25/GB-month; 1 GB is the minimum.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
