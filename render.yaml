databases:
  - name: socialposter-db
    plan: free
    databaseName: socialposter
    user: socialposter

services:
  - type: web
    name: socialposter
    runtime: python
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      mkdir -p src/socialposter/web/static/spa
      cp -r frontend/dist/* src/socialposter/web/static/spa/
      echo "SPA files before pip install:"
      find src/socialposter/web/static/spa -type f | head -20
      pip install --no-cache-dir --force-reinstall .
      echo "SPA files in installed package:"
      python -c "from pathlib import Path; import socialposter.web.app as m; p=Path(m.__file__).resolve().parent/'static'/'spa'; print('EXISTS' if (p/'index.html').exists() else 'MISSING'); [print(f) for f in p.rglob('*') if f.is_file()]" 2>&1 || echo "DIAGNOSTIC FAILED"
    startCommand: bash start.sh
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SOCIALPOSTER_SECRET_KEY
        generateValue: true
      - key: SOCIALPOSTER_ENCRYPTION_KEY
        generateValue: true
      - key: FLASK_APP
        value: socialposter.web.app:create_app
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: socialposter-db
          property: connectionString
      # Tell the app to write uploads onto the persistent disk below.
      - key: SOCIALPOSTER_UPLOAD_DIR
        value: /var/data/uploads
    # Persistent disk so user uploads survive restarts and redeploys.
    # Render charges $0.25/GB-month; 1 GB is the minimum.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
